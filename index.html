<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sudhanshu Shukla</title>
    <meta name="description" content="Sudhanshu Shukla: systems and backend engineer and competitive programmer. One continuous zoom from a transistor to the planet, with my work on the way." />
    <meta property="og:title" content="Sudhanshu Shukla" />
    <meta property="og:description" content="Systems and backend engineer, competitive programmer. From one transistor to the planet." />
    <meta property="og:url" content="https://sudhss.vercel.app/" />
    <meta name="theme-color" content="#05070b" />
    <link rel="icon" type="image/png" href="/Logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="world" aria-hidden="true"></canvas>
    <div id="labels" aria-hidden="true"></div>
    <div id="scrim" aria-hidden="true"></div>

    <header class="bar">
      <a class="mark" href="/">Sudhanshu Shukla</a>
      <nav class="bar-links">
        <a href="https://github.com/Sudhss" target="_blank" rel="noopener">GitHub</a>
        <a href="https://drive.google.com/file/d/1FsrJ9cA7nbWRvG7sRwN89J9b9El06dzE/view?usp=sharing" target="_blank" rel="noopener">Resume</a>
        <a href="mailto:shuklasudhanshu230405@gmail.com">Email</a>
      </nav>
    </header>

    <main id="panels"></main>

    <div id="prompt" aria-hidden="true">
      <span class="keys"><kbd class="up">&uarr;</kbd><kbd class="down">&darr;</kbd></span>
      <p class="desk"><b>Press &darr; to zoom out</b><span class="full">&uarr; comes back. The arrow keys are the smooth way; scrolling works too.</span><span class="tip">Tip: the arrow keys are smoother than scrolling.</span></p>
      <p class="touch"><b>Swipe up to zoom out</b></p>
    </div>
    <p id="edge" role="status" aria-live="polite"></p>

    <div id="hud" aria-hidden="true">
      <div><span>transistors in view, roughly</span><b id="hud-count">1</b></div>
      <div><span>width of view</span><b id="hud-size">60 nm</b></div>
    </div>

    <div id="controls">
      <span id="count">01 / 14</span>
      <button class="ctl" data-dir="-1" aria-label="Previous stop">&uarr;</button>
      <button class="ctl" data-dir="1" aria-label="Next stop">&darr;</button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
